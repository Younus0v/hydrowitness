name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests, website, statistics and sensitivity checks
        run: python tools/verify_all.py
      - name: Deeper fuzzing (more examples; slower)
        if: matrix.python-version == '3.13'
        env:
          HW_FUZZ_EXAMPLES: "1000"
        run: python -m pytest tests/test_properties.py -q -p no:cacheprovider
